<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10282d">
<meta name="description" content="A miniature steam railway. Throw the switches and bring every train home.">
<title>Brass Signal</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game" data-phase="boot">
 <div id="scene" role="img" aria-label="A miniature railway with three stations and two switch levers"></div>
 <div id="vignette" aria-hidden="true"></div>
 <header id="hud" hidden>
  <div class="yard"><span id="yard-num"></span><strong id="yard-name"></strong></div>
  <div id="schedule" aria-label="Train timetable"></div>
  <button id="pause" class="round" aria-label="Pause"><span aria-hidden="true">Ⅱ</span></button>
 </header>
 <div id="stations" aria-hidden="true">
  <span class="station" id="station-0">● <b>Fern</b></span><span class="station" id="station-1">◆ <b>Honey</b></span><span class="station" id="station-2">▲ <b>Poppy</b></span>
 </div>
 <div id="levers" hidden>
  <button id="lever-0" class="lever" type="button"><span class="lever-key">1</span><span class="lever-route"></span></button>
  <button id="lever-1" class="lever" type="button"><span class="lever-key">2</span><span class="lever-route"></span></button>
 </div>
 <div id="train-labels" aria-hidden="true"></div>
 <output id="feedback" aria-live="polite"></output>
 <div id="guide" hidden>Match each train to its station.</div>
 <div id="letterbox" hidden aria-hidden="true"></div>
 <div id="film" hidden><div><span id="film-tag"></span><strong id="film-title"></strong></div><button id="skip" class="plain">Skip <span aria-hidden="true">›</span></button></div>
 <section id="card" aria-label="Dispatch menu">
  <span id="eyebrow">A MINIATURE RAILWAY</span>
  <h1 id="title">BRASS<br>SIGNAL</h1>
  <p id="description">Throw the switches. Bring every train home.</p>
  <div id="stars" hidden aria-label="Rating"></div>
  <div id="routes" hidden aria-label="Select a yard"></div>
  <div id="actions">
   <button id="primary" class="primary">Dispatch <span aria-hidden="true">›</span></button>
   <button id="secondary" class="plain" hidden></button>
  </div>
  <p id="host-note" hidden></p>
 </section>
 <button id="sound" class="round" aria-label="Sound off" title="Toggle sound"></button>
</main>
<script src="vendor/three.min.js"></script>
<script type="module" src="app.mjs"></script>
</body>
</html>
